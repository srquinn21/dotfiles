[tools]
node = "lts"
python = ["3.12", "3.11", "3.10", "3.9"]

# Linux only. On macOS these come from the Brewfile. Homebrew on Linux needs
# root, so mise installs them under $HOME instead. Keep in step with the
# Brewfile's command-line tools (zsh, tmux and git come from the system).
starship = { version = "latest", os = ["linux"] }
btop = { version = "latest", os = ["linux"] }
neovim = { version = "latest", os = ["linux"] }
herdr = { version = "latest", os = ["linux"] }
zig = { version = "latest", os = ["linux"] }
bun = { version = "latest", os = ["linux"] }
ripgrep = { version = "latest", os = ["linux"] }
fd = { version = "latest", os = ["linux"] }
fzf = { version = "latest", os = ["linux"] }
zoxide = { version = "latest", os = ["linux"] }
bat = { version = "latest", os = ["linux"] }
glow = { version = "latest", os = ["linux"] }
eza = { version = "latest", os = ["linux"] }
stylua = { version = "latest", os = ["linux"] }
