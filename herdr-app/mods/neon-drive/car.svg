<svg xmlns="http://www.w3.org/2000/svg" width="120" height="38" viewBox="0 0 120 38">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff4fd8"/><stop offset="1" stop-color="#7a1fd1"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7aefff"/><stop offset="1" stop-color="#1a3a8f"/>
    </linearGradient>
  </defs>
  <!-- underglow -->
  <ellipse cx="60" cy="35" rx="54" ry="2.5" fill="#2de2ff" opacity="0.55"/>
  <!-- low wedge body: long nose to the right, fastback roof, squared tail -->
  <path d="M4 26 L6 18 L34 15 L50 7 L74 7 L88 15 L114 19 L117 24 L115 29 L4 29 Z" fill="url(#body)" stroke="#ffd6f6" stroke-width="0.8" stroke-linejoin="round"/>
  <path d="M38 15 L52 9 L72 9 L84 15 Z" fill="url(#glass)"/>
  <path d="M61 9 L60 15" stroke="#3a1060" stroke-width="1.5"/>
  <!-- side stripe -->
  <path d="M10 22 L112 22" stroke="#2de2ff" stroke-width="1.2"/>
  <!-- headlight and spoiler -->
  <rect x="110" y="20" width="6" height="2" rx="1" fill="#fff6c2"/>
  <path d="M2 14 L14 14 L14 16 L4 17 Z" fill="#ff4fd8" stroke="#ffd6f6" stroke-width="0.6"/>
  <path d="M8 16 L8 18" stroke="#ffd6f6" stroke-width="1"/>
  <!-- wheel arches -->
  <circle cx="28" cy="29" r="8" fill="#0a0514"/><circle cx="94" cy="29" r="8" fill="#0a0514"/>
</svg>
